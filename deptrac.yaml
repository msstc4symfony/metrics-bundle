# Canonical layers of the msstc4symfony bundle standard (stage B spec, section 2).
# Copy as-is; replace the BundleRoot value with ^<bundle class>$ (deptrac reads an unanchored regex: anchors and
# doubled backslashes, e.g. ^Msstc4Symfony\\FooBundle\\FooBundle$).
# A bundle may drop dependencies from the ruleset, never add them.
deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*

        - name: BundleRoot
          collectors:
              - type: classLike
                value: ^Msstc4Symfony\\MetricsBundle\\MetricsBundle$

    ruleset:
        # Metric definitions, collectors and the recorder/storage ports.
        Application: ~

        # Prometheus recorder/storage, DBAL, Elastica and http-client adapters.
        Infrastructure:
            - Application

        # Monolog handler decorator counting log records.
        Framework:
            - Application

        # Kernel, console and Messenger listeners, the metrics endpoint and commands.
        Presentation:
            - Application

        # Passes decorate services with adapters and register optional listeners by class.
        DependencyInjection:
            - Application
            - Infrastructure
            - Presentation
            - Framework

        BundleRoot:
            - Application
            - DependencyInjection
