name: Code Quality Checks

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v1.5.0
    with:
      slug: msstc4symfony/metrics-bundle
      extensions: 'mbstring, xml, ctype, iconv, intl, redis, apcu, mongodb'
      ini-values: 'apc.enable_cli=1'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The reusable workflow installs every optional library; this job proves the
  # class_exists/interface_exists guards hold when none of them is present.
  minimal:
    name: Unit tests without optional libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, redis
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-dist --no-progress --no-interaction

      - run: vendor/bin/phpunit
